name: PlatformIO Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# A newer commit on the same branch (or PR) cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # pioarduino 55.03.311 accepts 3.10-3.14; same as Dockerfile.firmware

      # pioarduino 55.03.311 for the C6 needs >= 6.1.19; pinned for reproducible builds.
      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build v1 board (XIAO ESP32-C6)
        run: pio run -e xiao_c6

      - name: Name the binaries
        run: |
          mkdir dist
          cp .pio/build/xiao_c6/firmware.bin dist/firmware.bin
          cp .pio/build/xiao_c6/firmware.factory.bin dist/firmware-full-usb.bin

      - name: Upload web UI update image
        uses: actions/upload-artifact@v4
        with:
          name: firmware-update
          path: dist/firmware.bin
          if-no-files-found: error

      - name: Upload full USB image
        uses: actions/upload-artifact@v4
        with:
          name: firmware-full-usb
          path: dist/firmware-full-usb.bin
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run native tests
        run: |
          docker build -f Dockerfile.test -t esp-tests .
          docker run --rm esp-tests

  mechanical:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the EDA and CAD containers
        run: docker compose --profile hardware build eda cad

      # The enclosure tests read the part boxes of the stored layouts (git-ignored build output)
      - name: Export part boxes from the stored layouts
        run: |
          for board in main ui reader; do
            docker compose --profile hardware run --rm -T eda "python3 hardware/scripts/layout.py $board components"
          done

      - name: Enclosure, legend and print-rule tests
        run: >
          docker compose --profile hardware run --rm -T cad
          "python3 -m pytest -q -p no:cacheprovider --tb=short
          mechanical/tests/test_enclosure_probe.py mechanical/tests/test_front_legend.py
          mechanical/tests/test_accessories.py mechanical/tests/test_box_enclosure.py
          mechanical/tests/test_dial_reader.py mechanical/tests/test_print_rules.py"
