# V1 main board, 4 layers, 1.2 mm, vertical PCB along the left wall of the
# 1-DIN case (39.8 x 77.4 mm, enclosure x -5.4..-4.2, y 1.8..79.2, z 2.1..41.9:
# 0.2 mm clearance to the 77.8 mm inner cavity at both ends).
#
# 6.0 mm creepage + milled slot between SELV and the 230 VAC RELAY domain
# (Omron G6B-2114P: 3 kVAC / 6 kV coil-contacts, coil pads 10.16 mm from the
# contact pads); 2.5 mm between the relay nets themselves:
#   - Bottom-left (x 0..14.8, y 0..30.8): J1 (GND, VIN+), K1 coil (pins 1 & 8 at x=14.0)
#   - Milled air slot (x 15.8..17.4, y 1.0..26.8) + 6.6 mm copper keepout band
#   - Bottom-right (x 18.0..39.8, y 0..25.0): K1 contacts (x=24.16: COM 3/6, x=31.78: NO 4 / NC 5) + J4 (COM, NO, NC)
#   - Zero GND pour on In1.Cu anywhere near the RELAY domain or keepout band.
# Only mechanical/enclosure-mated anchors are fixed here; all active ICs,
# magnetics, discrete semiconductors, fuses and passives are placed
# deterministically by the 2-stage OR-Tools CP-SAT placer (`placer.py`).

frame:
  size: { x: 39.8, y: 77.4 }
  copper_layers: 4
  thickness: 1.2
  min_drill: 0.2
  min_track: 0.12
  edge_clearance: 0.3
  silk_inside: true
  fine_pitch_power_pads: [U1, J3]
  raised_modules: [U3]
  plane_layers: [In1.Cu]
  domains: [SELV, RELAY]
  domain_regions:
    SELV:
      - { x0: 0.0,  y0: 0.0,  x1: 15.0, y1: 31.5 }
      - { x0: 0.0,  y0: 31.5, x1: 39.8, y1: 77.4 }
    RELAY:
      - { x0: 18.0, y0: 0.0,  x1: 39.8, y1: 25.0 }
  isolators: [K1]
  power_nets: [VIN_RAW, VIN_FUSED, +24V_LOOP, +5V, +5V_XIAO, RELAY_NC, RELAY_COM, RELAY_NO]
  slots:
    - { x0: 15.8, y0: 1.0,  x1: 17.4, y1: 26.8 }
  copper_keepout:
    - { x0: 15.0, y0: 0.5,  x1: 18.2, y1: 25.0 }
    - { x0: 15.0, y0: 25.0, x1: 39.3, y1: 31.2 }
  pours:
    - net: GND
      layers: [In1.Cu]
      region: [[0.5, 0.5], [11.8, 0.5], [11.8, 31.5], [39.3, 31.5], [39.3, 76.9], [0.5, 76.9]]

heights:
  default: 1.2
  J1: 8.3
  J2: 8.3
  J3: 1.2
  J4: 10.1
  J5: 8.3
  J6: 8.3
  U3: 11.0
  K1: 11.0
  Q1: 1.2
  F1: 1.6
  D1: 2.0
  D2: 2.0
  D3: 1.1
  D4: 1.1
  D5: 1.1
  D6: 1.1
  D7: 2.0
  D12: 2.3
  D8: 1.4
  D9: 2.0
  F2: 1.0
  L1: 2.0

placement:
  default_side: front
  keepouts:
    # Reserve part-free columns in the two upper quadrants so `build_enclosure.front_posts()`
    # always places outer right-wall board supports clear of parts (lower quadrants sit in the
    # y 25..31.2 isolation keepout band).
    - { x0: 6.5,  y0: 60.2, x1: 9.5,  y1: 63.2, side: front }
    - { x0: 36.2, y0: 60.2, x1: 39.2, y1: 63.2, side: front }

parts:
  # --- Mechanical & isolation-bridging anchors (locked: true) ---
  J1:  { x: 6.4,   y: 7.25,  rot: 0,   block: terminals_bottom, locked: true }
  J4:  { x: 30.8,  y: 3.0,   rot: 0,   block: terminals_bottom, locked: true }
  K1:  { x: 22.89, y: 18.2,  rot: 0,   block: relay,            locked: true }
  J2:  { x: 31.10, y: 70.15, rot: 180, block: terminals_top,    locked: true }
  J5:  { x: 18.00, y: 70.15, rot: 180, block: terminals_top,    locked: true }
  J6:  { x: 6.65,  y: 70.15, rot: 180, block: terminals_top,    locked: true }
  J3:  { x: 5.5,   y: 44.0,  rot: -90, block: int_ui,           locked: true }
  U3:  { x: 27.6,  y: 40.5,  rot: 90,  block: mcu,              locked: true }
