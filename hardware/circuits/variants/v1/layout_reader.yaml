# V1 optical dial reader (accessory board, ordered on its own): 31.5 x 18 mm, 4 layers, 1.2 mm.
# Plan coords = dial coords + (10.5, 9): dial (0, 0) is the dial centre, +x points at the
# reflective wheel (axis 20.5 mm out on the GMDM dial, half-disc Ø14.5 mm).
# Only mechanical anchors (cable terminal J1, optical sensor U1 on back, trimmer RV1 and
# indicator LED D2 under lid openings) are fixed here; all active/passive parts are placed
# deterministically by the 2-stage OR-Tools CP-SAT placer (`placer.py`).

frame:
  size: { x: 31.5, y: 18.0 }
  copper_layers: 4
  thickness: 1.2
  min_drill: 0.2
  min_track: 0.15
  edge_clearance: 0.3
  silk_inside: true
  plane_layers: [In1.Cu]
  domains: [SELV]
  domain_regions:
    SELV: { x0: 0.0, y0: 0.0, x1: 31.5, y1: 18.0 }
  isolators: []
  power_nets: [+5V_IN, +5V_S]
  pours:
    - { net: GND, layers: [In1.Cu], region: { x0: 0.4, y0: 0.4, x1: 31.1, y1: 17.6 } }

heights:
  default: 1.2
  J1: 2.7
  U1: 7.0
  RV1: 1.2
  D1: 1.2

placement:
  default_side: front
  keepouts:
    # Carrier lid clamping posts (dial (-9, +-7) and (19.5, +-6.4), r=1.4 mm) + carrier rim at +x corners
    - { x0: 0.0,  y0: 0.0,  x1: 3.3,  y1: 3.8,  side: front }
    - { x0: 0.0,  y0: 14.2, x1: 3.3,  y1: 18.0, side: front }
    - { x0: 28.0, y0: 0.0,  x1: 31.5, y1: 4.4,  side: front }
    - { x0: 28.0, y0: 13.6, x1: 31.5, y1: 18.0, side: front }

parts:
  # --- Mechanical housing-mated anchors (locked: true) ---
  J1:  { x: 4.9,  y: 9.0,  rot: 0,   block: connector,  locked: true }
  U1:  { x: 27.0, y: 9.0,  rot: 90,  side: back, block: sensor, locked: true }
  RV1: { x: 12.2, y: 9.0,  rot: 0,   block: comparator, locked: true }
  D2:  { x: 16.0, y: 15.5, rot: 0,   block: output,     locked: true }
