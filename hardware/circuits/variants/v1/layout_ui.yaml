# V1 UI board, 4 layers, 1.2 mm, inside the 1-DIN front protrusion (13.8 x
# 40.5 mm, with a 1.3 x 9.8 mm cutout at the top edge x 2.0..11.8, y 39.2..40.5
# for the 9.3 mm wide, 12.0 mm long OLED flex tail).
# Front: 0.96" 64x128 SSD1312 portrait I2C OLED panel (y 11.5..39.5), two Omron
# B3U-1000P switches at y 9.3, and three WS2812B-MINI-V3J RGB LEDs at y 3.8.
# Back: 14-pin 0.62 mm pitch hotbar FPC footprint J2 at y 34.5 and 8-pin FFC J1
# to main at y 14.8; all unlocked active/passive parts on `back` are solved
# deterministically by the 2-stage OR-Tools CP-SAT placer (`placer.py`).

frame:
  size: { x: 13.8, y: 40.5 }
  outline: [[0.0, 0.0], [13.8, 0.0], [13.8, 40.5], [11.8, 40.5], [11.8, 39.2], [2.0, 39.2], [2.0, 40.5], [0.0, 40.5]]
  copper_layers: 4
  thickness: 1.2
  min_drill: 0.2
  min_track: 0.12
  edge_clearance: 0.3
  silk_inside: true
  fine_pitch_power_pads: [J1, J2, U1, D1, D2, D3]
  plane_layers: [In1.Cu]
  domains: [SELV]
  domain_regions:
    SELV: { x0: 0.0, y0: 0.0, x1: 13.8, y1: 40.5 }
  isolators: []
  power_nets: [+3V3, +5V]
  pours:
    - { net: GND, layers: [In1.Cu], region: { x0: 0.4, y0: 0.35, x1: 13.4, y1: 38.8 } }

oled_module:
  outline: { x: 0.0,  y: 11.5, w: 13.8,  h: 28.0 }
  glass:   { x: 1.47, y: 13.1, w: 10.86, h: 21.74 }

case:
  standoffs: []

heights:
  default: 1.2
  SW1: 1.6
  SW2: 1.6
  D1: 1.57
  D2: 1.57
  D3: 1.57
  J1: 1.2
  J2: 0.3

placement:
  default_side: back
  edge_margins:
    # Clear cover UI snap hooks (0.5 mm side overlap + 0.3 mm air gap) and end locating ribs
    back: { x0: 0.9, x1: 0.9, y0: 0.9, y1: 1.6 }

parts:
  # --- Mechanical enclosure-mated anchors (locked: true) ---
  SW1: { x: 2.8,   y: 9.3,   rot: 0,   block: btn_ladder, locked: true }
  SW2: { x: 11.0,  y: 9.3,   rot: 0,   block: btn_ladder, locked: true }
  D1:  { x: 2.5,   y: 3.8,   rot: 0,   block: leds,       locked: true }
  D2:  { x: 6.9,   y: 3.8,   rot: 0,   block: leds,       locked: true }
  D3:  { x: 11.3,  y: 3.8,   rot: 0,   block: leds,       locked: true }
  J2:  { x: 6.9,   y: 34.5,  rot: 180, side: back, block: oled,     locked: true }
  J1:  { x: 6.9,   y: 14.8,  rot: 180, side: back, block: int_main, locked: true }
