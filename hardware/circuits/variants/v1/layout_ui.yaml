# V1 UI board, 4 layers, 1.2 mm, inside the 1-DIN front protrusion (13.8 x
# 40.5 mm, with a 1.3 x 9.8 mm cutout at the top edge x 2.0..11.8, y 39.2..40.5
# for the 9.3 mm wide, 12.0 mm long OLED flex tail).
# Front: 0.96" 64x128 SSD1312 portrait I2C OLED panel (QG-6428TSWCG02 /
# JLX12864OLED-S096W / NFP1312-15AY, 14.0 x 28.0 mm, y 11.5..39.5, supported on
# double-sided foam tape over the cover backing rails), two Omron B3U-1000P
# compact-pad switches at y 6.0 rotated 90 deg and aligned at x 2.8 and x 11.0
# directly above D1 and D3, and the three SK6805-EC15 RGB LEDs in a horizontal
# row below the buttons at y 2.0.
# Back: 14-pin 0.62 mm pitch (P0.62x13=8.06 mm) hotbar/solder FPC footprint J2
# at y 34.5 (directly below the 9.8 mm top notch so the 12.0 mm flex tail lands
# squarely on the 2.5 mm solder pads) with the SSD1312 3.3 V charge-pump caps +
# IREF resistor below it (y 21.5..30.0), 8-pin FFC J1 to main at y 14.8, and the
# 5 V buffer.

frame:
  size: { x: 13.8, y: 40.5 }
  outline: [[0.0, 0.0], [13.8, 0.0], [13.8, 40.5], [11.8, 40.5], [11.8, 39.2], [2.0, 39.2], [2.0, 40.5], [0.0, 40.5]]
  copper_layers: 4
  thickness: 1.2
  min_drill: 0.2
  min_track: 0.12
  edge_clearance: 0.3
  silk_inside: true
  fine_pitch_power_pads: [J1, J2, U1, D1, D2, D3]
  plane_layers: [In1.Cu]
  domains: [SELV]
  domain_regions:
    SELV: { x0: 0.0, y0: 0.0, x1: 13.8, y1: 40.5 }
  isolators: []
  power_nets: [+3V3, +5V]
  pours:
    - { net: GND, layers: [In1.Cu], region: { x0: 0.4, y0: 0.35, x1: 13.4, y1: 38.8 } }

oled_module:
  # 0.96" 64x128 portrait SSD1312 OLED (QG-6428TSWCG02 / JLX12864OLED-S096W / NFP1312-15AY):
  # panel 14.0 x 28.0 mm (y 11.5..39.5, tail at top y=39.5), active area 10.86 x 21.74 mm
  # starting 1.60 mm from bottom non-tail edge (y = 11.5 + 1.6 = 13.1..34.84)
  outline: { x: 0.0,  y: 11.5, w: 13.8,  h: 28.0 }
  glass:   { x: 1.47, y: 13.1, w: 10.86, h: 21.74 }

case:
  standoffs:
    - { x: 1.3,  y: 38.8 }
    - { x: 12.5, y: 38.8 }

heights:
  default: 1.2
  SW1: 1.6
  SW2: 1.6
  J1: 1.2
  J2: 0.3

parts:
  SW1: { x: 2.8,   y: 6.0,   rot: 90,  block: btn_ladder, locked: true }
  SW2: { x: 11.0,  y: 6.0,   rot: 90,  block: btn_ladder, locked: true }
  D1:  { x: 2.8,   y: 2.0,   rot: 0,   block: leds, locked: true }
  D2:  { x: 6.9,   y: 2.0,   rot: 0,   block: leds, locked: true }
  D3:  { x: 11.0,  y: 2.0,   rot: 0,   block: leds, locked: true }

  J2:  { x: 6.9,   y: 34.5,  rot: 180, side: back, block: oled, locked: true }
  C9:  { x: 10.6,  y: 30.0,  rot: 0,   side: back, block: oled }
  C8:  { x: 6.9,   y: 30.0,  rot: 0,   side: back, block: oled }
  C11: { x: 3.2,   y: 30.0,  rot: 0,   side: back, block: oled }
  C10: { x: 3.2,   y: 27.2,  rot: 0,   side: back, block: oled }
  R6:  { x: 6.9,   y: 27.2,  rot: 0,   side: back, block: oled }
  R5:  { x: 10.6,  y: 27.2,  rot: 0,   side: back, block: oled }
  C7:  { x: 6.9,   y: 24.4,  rot: 0,   side: back, block: oled }
  R1:  { x: 6.9,   y: 21.5,  rot: 0,   side: back, block: btn_ladder }
  C1:  { x: 10.6,  y: 21.5,  rot: 0,   side: back, block: btn_ladder }
  R2:  { x: 3.2,   y: 21.5,  rot: 0,   side: back, block: btn_ladder }
  J1:  { x: 6.9,   y: 14.8,  rot: 180, side: back, block: int_main, locked: true }
  U1:  { x: 6.9,   y: 9.2,   rot: 0,   side: back, block: leds }
  C2:  { x: 2.8,   y: 9.2,   rot: 90,  side: back, block: leds }
  C3:  { x: 11.0,  y: 9.2,   rot: 90,  side: back, block: leds }
  R4:  { x: 6.9,   y: 6.0,   rot: 0,   side: back, block: leds }
  R3:  { x: 11.0,  y: 6.0,   rot: 0,   side: back, block: btn_ladder }
  C4:  { x: 2.8,   y: 3.0,   rot: 0,   side: back, block: leds }
  C5:  { x: 6.9,   y: 3.0,   rot: 0,   side: back, block: leds }
  C6:  { x: 11.0,  y: 3.0,   rot: 0,   side: back, block: leds }
