      - RELAY_MCU
      - RELAY_BASE
      - RELAY_COIL_N
      - BUCK5_SW
      - Net-*
      SELV-Power:
      - VIN_RAW
      - VIN_FUSED
      - +24V_LOOP
      - +5V
      - +5V_XIAO
      RELAY-Power:
      - RELAY_NC
      - RELAY_COM
      - RELAY_NO
    ui:
      SELV:
