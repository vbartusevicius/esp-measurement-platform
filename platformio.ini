; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ESP Measurement Platform v1 hardware (hardware/releases/v1): Seeed XIAO
; ESP32-C6 on the main board. Arduino-ESP32 3.x comes from the pioarduino
; platform (the official espressif32 platform has no Arduino core for the C6).
[env:xiao_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32c6
board_build.partitions = partitions_xiao_c6.csv
monitor_speed = 115200
extra_scripts =
	pre:tools/version.py
	pre:tools/embed_web.py
lib_deps =
	bblanchon/ArduinoJson@^7.2
	ESP32Async/AsyncTCP@3.5.0
	ESP32Async/ESPAsyncWebServer@3.12.1
	olikraus/U8g2@^2.35.9
	tzapu/WiFiManager@2.0.17
	https://github.com/256dpi/arduino-mqtt
	tcmenu/TaskManagerIO@^1.5.1
	adafruit/Adafruit NeoPixel@1.15.5

[env:xiao_c6_ota]
extends = env:xiao_c6
upload_protocol = espota

[env:native]
platform = native
test_framework = googletest
build_flags =
	-std=gnu++17
	-DARDUINOJSON_ENABLE_ARDUINO_STRING=1
	-I test/test_native/fakes
	-I lib/Plugins/AnalogDistance
	-I lib/Plugins/UltrasonicDistance
	-I lib/Plugins/RadiationCounter
	-I lib/Plugins/DistanceBase
	-I lib/Plugins/AnalogVoltage
	-I lib/Plugins/PulseMeter
	-I lib/Plugins
lib_deps =
	googletest
	bblanchon/ArduinoJson@^7.2
test_build_src = no
test_ignore = test_embedded
lib_ignore =
	Display
	Network
	WebApi
	Plugins
